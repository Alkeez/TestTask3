stages:
  - test
  - build
  - deploy

variables:
  DOCKER_IMAGE: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-$CI_COMMIT_SHORT_SHA
  DOCKER_IMAGE_LATEST: $CI_REGISTRY_IMAGE:$CI_COMMIT_REF_SLUG-latest

.test_template:
  stage: test
  image: python:3.10-slim
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

linting:
  extends: .test_template
  script:
    - pip install flake8 black
    - black --check app/
    - flake8 app/

unit_tests:
  extends: .test_template
  services:
    - name: postgres:15-alpine
      alias: localhost
  variables:
    ENV: "test"
    DB: "postgresql"
    DB_USER: "postgres"
    DB_PASSWORD: "test_password"
    POSTGRES_PASSWORD: "test_password"
    DB_HOST: "localhost"
    DB_PORT: "5432"
  before_script:
    - apt-get update && apt-get install -y libpq-dev build-essential
    - pip install -r requirements.txt
    - pip install pytest pytest-cov
  script:
    - alembic upgrade head
    - pytest --cov=app --cov-report=term-missing

build_image:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
  script:
    - docker build -t $DOCKER_IMAGE -t $DOCKER_IMAGE_LATEST .
    - docker push $DOCKER_IMAGE
    - docker push $DOCKER_IMAGE_LATEST
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"

deploy_dev:
  stage: deploy
  image: alpine/k8s:1.28.2
  variables:
    ENV_NAME: dev
    DB_NAME: dev-fca
  before_script:
    - mkdir -p ~/.kube
    - echo "$KUBECONFIG_DEV" | base64 -d > ~/.kube/config
  script:
    - apk add --no-cache gettext
    - kubectl create namespace $ENV_NAME --dry-run=client -o yaml | kubectl apply -f -
    - envsubst < k8s/postgres-local.yaml | kubectl apply -f -
    - envsubst < k8s/configmap-secret.yaml | kubectl apply -f -
    - envsubst < k8s/deployment.yaml | kubectl apply -f -
    - envsubst < k8s/service-ingress.yaml | kubectl apply -f -
  rules:
    - if: $CI_COMMIT_BRANCH == "main"

deploy_staging:
  stage: deploy
  image: alpine/k8s:1.28.2
  variables:
    ENV_NAME: stage
    DB_NAME: stage-fca
  script:
    - echo "Заглушка деплоя на Staging"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v-[0-9]+\.[0-9]+\.[0-9]+-rc/
      when: manual

deploy_production:
  stage: deploy
  image: alpine/k8s:1.28.2
  variables:
    ENV_NAME: prod
    DB_NAME: fca
  script:
    - echo "Заглушка деплоя на Production"
  rules:
    - if: $CI_COMMIT_TAG =~ /^v-[0-9]+\.[0-9]+\.[0-9]+$/
      when: manual